packages:
  - apps/*
  - libs/*
  - infra/*
  - tools/*
  - .claude

catalogMode: prefer

catalog:
  "@r_masseater/oxlint-typed-rules": 0.0.2
  "@ast-grep/cli": 0.51.0
  "@effect/platform-node": 4.1.1
  "@eslint-react/eslint-plugin": 5.28.8
  "@shadcn/lint": 0.2.3
  "@tanstack/eslint-plugin-query": 5.105.1
  "@tanstack/eslint-plugin-router": 1.162.0
  "@types/node": 26.6.6
  eslint-plugin-drizzle: 0.2.3
  eslint-plugin-react-hooks: 7.1.1
  syncpack: 15.3.3
  "@r_masseater/oxlint-plugin-decision": 0.0.4
  eslint-plugin-no-comments: 1.2.1
  eslint-plugin-baseline-js: 0.7.7
  "@html-eslint/eslint-plugin-react": 0.67.0
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  skills: 1.7.4
  "@tanstack/intent": 0.5.6
  "@yarnpkg/parsers": 3.1.0
  vitest: 5.0.5
  "@effect/vitest": 4.1.1
  typescript-6: npm:@typescript/typescript6@6.0.2
catalogs:
  stack:
    "@distilled.cloud/cloudflare": 1.0.0-rc.17
    "@effect/tsgo": 0.63.0
    "@alchemy.run/cloudflare": 2.0.0-beta.84
    alchemy: 2.0.0-beta.84
    effect: 4.1.1
    fallow: 3.38.1
    renovate: 44.199.0
    textlint: 15.8.0
    typescript: 7.0.2
    vite-plus: 1.4.0
overrides:
  effect: "catalog:stack"
  "@effect/platform-node-shared": 4.1.1
  "@effect/sql-d1": 4.1.1
  "@effect/vitest": "catalog:"
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  eslint-plugin-react-hooks>zod-validation-error: ^5.0.0
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@<11.0.1: ^11.0.1
peerDependencyRules:
  allowAny:
    - vite
allowBuilds:
  "@ast-grep/cli": true
  esbuild: true
  workerd: true
  protobufjs: false
  core-js-pure: false
  dtrace-provider: false
  re2: true
  "@openrouter/sdk": false
packageExtensions:
  "@feature-sliced/steiger-plugin":
    dependencies:
      "@steiger/toolkit": 0.2.3
minimumReleaseAgeExclude:
  - "@r_masseater/oxlint-typed-rules@0.0.2"
  - "@r_masseater/oxlint-plugin-decision@0.0.4"
audit:
  ignorePrune: true
  ignore:
    - GHSA-gcqx-w48m-w2h4
